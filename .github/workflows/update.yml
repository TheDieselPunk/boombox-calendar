name: Update calendar feed

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6h (UTC); odd minute avoids the top-of-hour rush
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - boombox_ics.py
      - .github/workflows/update.yml

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build boombox.ics
        run: python boombox_ics.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add boombox.ics
          if git diff --cached --quiet; then
            echo "Feed unchanged"
          else
            git commit -m "Update feed $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
