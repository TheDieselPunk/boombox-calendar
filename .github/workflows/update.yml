# NOTE: Shotgun returns 429 instantly to GitHub's runner IPs (datacenter block),
# so this cannot run on a schedule here. The feed is rebuilt by update.sh via
# cron on a residential-IP host, which pushes boombox.ics; Pages serves it.
# This workflow is kept for manual runs only, in case the block is ever lifted.

name: Update calendar feed (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build feeds
        run: python build_feeds.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.ics events.json feeds.json
          if git diff --cached --quiet; then
            echo "Feeds unchanged"
          else
            git commit -m "Update feeds $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
